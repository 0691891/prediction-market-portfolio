name: 500-Match Backtest & Calibration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/backtest.py"
      - ".github/workflows/backtest.yml"
  schedule:
    - cron: "35 6 * * 0"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 500-match public-data no-lookahead backtest
        run: python src/backtest.py
      - name: Commit metrics
        run: |
          git config user.name "prediction-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json data/calibrated_params.json
          git diff --cached --quiet || git commit -m "model: refresh 500-match holdout performance"
          git push
