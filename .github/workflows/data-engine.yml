name: v0.3.5 Football Intelligence + PIT + CLV + Alpha Attribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/config.json'
      - '.github/workflows/data-engine.yml'
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh intelligence, market data, PIT, CLV and attribution
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python src/football_intelligence.py
          python src/fair_model.py
          python src/sportsbook_consensus.py
          python src/discover_markets.py
          python src/data_engine.py
          python src/point_in_time.py
          python src/clv_engine.py
          python src/alpha_attribution.py
      - name: Commit changed snapshots
        run: |
          git config user.name "prediction-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/football_intelligence.json data/model_fair.json data/board.json data/sportsbook_consensus.json data/market_snapshot.json data/market_candidates.json data/approval.json data/pit data/clv.json data/alpha_attribution.json
          git diff --cached --quiet || git commit -m "data: refresh v0.3.5 attribution snapshots"
          git push
